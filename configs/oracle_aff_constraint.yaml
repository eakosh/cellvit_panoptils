# Oracle + Training-time compatibility constraint.
# Same architecture as oracle_aff.yaml (single CellViT encoder, GT tissue
# injected one-hot via Multi-level AFF) PLUS the learned compatibility
# constraint applied to nuclei-type logits. Used to ablate the constraint
# under perfect tissue: how much does the learned (nucleus, tissue) prior
# add on top of an already-correct tissue signal?

experiment: "oracle_aff_constraint"

data:
  root: "PanopTILs_data/BootstrapNucleiManualRegions_TCGA_05132021"
  subset: "tcga"
  batch_size: 16
  num_workers: 4
  cache_dataset: true
  pin_memory: true
  persistent_workers: true

  use_weighted_sampler: true
  gamma_s: 0.95

  num_nuclei_classes: 10
  num_tissue_classes: 5
  nuclei_unlabeled_class: 0
  nuclei_background_class: 9
  nuclei_ambiguous_classes: [8]
  tissue_ignore_classes: [0]
  excluded_tissue_classes: [0, 8]

splits:
  fold: 5

model:
  embed_dim: 384
  depth: 12
  num_heads: 6
  extract_layers: [3, 6, 9, 12]
  encoder_pretrained: "weights/vit256_small_dino.pth"

  use_tissue_branch: true
  tissue_fusion: "multi_aff"
  tissue_encoder_type: "external"

  oracle_tissue_training: true
  fusion_warmup_epochs: 0
  fusion_reduction: 4
  freeze_tissue_after_fusion_warmup: false
  use_compatibility_constraint: true

loss:
  lambda_np_ft: 1.0
  lambda_np_dice: 1.0

  lambda_hv_mse: 2.5
  lambda_hv_msge: 8.0

  lambda_nt_ft: 0.75
  lambda_nt_dice: 0.3
  lambda_nt_bce: 0.75

  lambda_ts_ft: 0.0
  lambda_ts_dice: 0.0
  lambda_ts_ce: 0.0

  lambda_tc_ce: 0.0

  ft_alpha: 0.7
  ft_beta: 0.3
  ft_gamma: 1.3333   # 4/3
  ft_eps: 1.0e-6

train:
  lr: 0.0003
  wd: 0.0001
  betas: [0.85, 0.85]

  epochs: 130

  scheduler_type: exponential
  scheduler_gamma: 0.85

  use_mixed_precision: true
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0

  freeze_encoder_epochs: 25

  val_metric_interval: 5
  early_stopping_patience: 15
